name: Hypixel Stat Tracker

on:
  schedule:
    # Runs automatically every day at 08:00 UTC
    - cron: '0 8 * * *'
  # Allows you to click "Run workflow" manually from the GitHub UI anytime
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Downloads your repository code to GitHub's server
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Sets up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Installs your packages (googleapis, node-fetch, etc.)
      - name: Install Dependencies
        run: npm ci

      # 4. Runs your index.js script with your Secrets & Variables
      - name: Run Stats Script
        env:
          # Secrets (Encrypted)
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_KEY }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_EMAIL }}

          # Variables (Configuration)
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          PLAYER_UUID: ${{ vars.UUID }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: node index.js